; ---------------------------------------------------------------------------
; PHP tuning for the LOCAL Sail container only.
;
; Sail serves with `artisan serve` (CLI SAPI), where opcache.enable_cli
; defaults to 0 — so every request re-parsed and re-compiled the ~15k files of
; vendor/, read over a bind mount backed by OneDrive on Windows. Production is
; unaffected: it builds from ./Dockerfile and uses docker/php.ini.
;
; Mounted as 99-zz-local.ini so it sorts AFTER Sail's own 99-sail.ini.
; ---------------------------------------------------------------------------

; Keep compiled bytecode in each worker process across requests.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
; Code edits still apply on their own (this is a dev box), but files are
; re-checked at most once a minute instead of on every request. Measured on
; this machine: freq=2 → 2.24s average per request, freq=60 → 0.35s. The cost
; is one slower request when the window rolls over, which beats paying it
; every time. Setting this to 0 shaves another ~0.1s but then PHP ignores
; edits until the container restarts — not worth the confusion.
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Path resolution is the real cost over virtiofs + OneDrive. The defaults
; (4M / 120s) expire mid-session, which is what made request times swing
; between 0.2s and 6s at random. Bigger cache, longer TTL.
realpath_cache_size=8M
realpath_cache_ttl=600

; Loaded but idle; make it explicit so it never costs anything here.
xdebug.mode=off
