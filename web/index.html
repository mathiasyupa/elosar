<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elosar — Software médico para consultorios y clínicas en Ecuador</title>
    <meta
      name="description"
      content="Agenda, historia clínica, recetas, órdenes de examen y facturación electrónica SRI en una sola app. Pensada para médicos y clínicas del Ecuador."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="canonical" href="https://elosar.site/" />

    <!-- Favicon: Elosar cube logo on a teal tile. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph. WhatsApp is how this gets shared in Ecuador, and it reads
         these tags: it needs an ABSOLUTE og:image URL and shows roughly the
         first 65 chars of the title. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elosar" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:url" content="https://elosar.site/" />
    <meta property="og:title" content="Elosar — Tu consultorio o clínica en un solo lugar" />
    <meta
      property="og:description"
      content="Agenda, historia clínica, recetas y facturación electrónica SRI. Software médico para Ecuador."
    />
    <meta property="og:image" content="https://elosar.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Elosar — software médico para consultorios y clínicas" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elosar — Tu consultorio o clínica en un solo lugar" />
    <meta
      name="twitter:description"
      content="Agenda, historia clínica, recetas y facturación electrónica SRI. Software médico para Ecuador."
    />
    <meta name="twitter:image" content="https://elosar.site/og-image.jpg" />
    <script>
      // Apply saved theme before paint to avoid flash (FOUC).
      // Quien entra por primera vez ve SIEMPRE Elosar en claro: es la
      // cara del producto, y seguir el modo oscuro del sistema hacía que la
      // primera impresión dependiera de la configuración del computador.
      (function () {
        try {
          var savedPreset = localStorage.getItem('medikal-preset');
          var preset = ['serene', 'slate', 'asencia'].includes(savedPreset) ? savedPreset : 'serene';
          var mode = localStorage.getItem('medikal-theme');
          document.documentElement.setAttribute('data-preset', preset);
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;750&family=JetBrains+Mono:wght@400;500;600&family=Libre+Caslon+Text&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
